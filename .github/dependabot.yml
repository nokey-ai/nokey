# Baseline Dependabot config. Universal piece is github-actions: keeps every
# repo's workflow `uses:` refs current (and is the natural companion to SHA
# pinning — Dependabot bumps the pinned SHA + comment for you).
#
# Add language ecosystems per repo as needed (uncomment + adjust directory):
#   npm / pip / bundler / gomod / cargo / composer / terraform / docker / ...
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5

