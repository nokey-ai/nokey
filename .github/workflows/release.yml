name: Release

on:
  push:
    tags:
      - "v*"
  # Dry run: builds every target and exercises the whole pipeline without
  # publishing, so the release path can be verified before a tag is spent.
  # Tags are immutable here, so a release that fails after the tag is pushed
  # costs a version number.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same gate as CI, so a tag cut from a commit CI never saw is still
  # race-checked on Linux and macOS and scanned for reachable vulnerabilities.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"

      - name: Test
        run: go test ./... -race

      - name: Vet
        run: go vet ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"

      - name: Install govulncheck
        run: |
          for attempt in 1 2 3; do
            go install golang.org/x/vuln/cmd/govulncheck@v1.7.0 && exit 0
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      - name: govulncheck
        run: govulncheck ./...

  release:
    needs: [test, vulncheck]
    runs-on: macos-latest
    # Only this job publishes: GoReleaser creates the GitHub release and
    # uploads its assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.10"

      # The indirect dependency on github.com/1password/onepassword-sdk-go
      # (pulled in via byteness/keyring's opdesktop.go) fails to cross-compile
      # darwin/linux without CGO. We build darwin natively with Apple clang
      # (no osxcross needed) and install real Linux cross-toolchains from
      # messense/macos-cross-toolchains so the Linux targets can also link
      # with CGO. Windows stays CGO-free.
      # Homebrew now refuses to load formulae from a third-party tap until it
      # is explicitly trusted, which stopped the v0.5.1 release before
      # GoReleaser ran. Trusting the tap restores the behaviour this workflow
      # already relied on rather than granting anything new.
      - name: Install Linux cross-toolchains
        run: |
          brew tap messense/macos-cross-toolchains
          brew trust messense/macos-cross-toolchains
          brew install x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      # A stable signing identity keeps the keychain trusting nokey across
      # upgrades (see the darwin build hook in .goreleaser.yaml). The
      # certificate can be self-signed: codesign doesn't need it trusted,
      # only the same certificate every release. Without the secret the
      # build falls back to ad-hoc signing.
      - name: Import code-signing certificate
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGN_P12" ]; then
            echo "::warning::MACOS_SIGN_P12 is not set; darwin binaries will be ad-hoc signed"
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(openssl rand -hex 16)
          p12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$p12" -k "$kc" -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          # Let codesign use the key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          # codesign only finds identities in the search list.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -p codesigning "$kc" | awk '$1 == "1)" { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::no code-signing identity found in MACOS_SIGN_P12"
            exit 1
          fi
          echo "Signing darwin binaries with $identity"
          echo "NOKEY_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Generate tap token
        id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: nokey-ai
          repositories: homebrew-tap

      # Installed directly rather than through goreleaser/goreleaser-action,
      # for the same reason as golangci-lint in ci.yml: only GitHub-owned and
      # Marketplace-verified actions are permitted here, and a rejected action
      # fails the run at startup — which on a tag means a release that
      # publishes nothing. Pinned rather than tracking latest so a release is
      # reproducible.
      # GOTOOLCHAIN=auto only for this step: GoReleaser itself needs a newer Go
      # than nokey builds with, and setup-go pins GOTOOLCHAIN=local, which
      # makes the install fail rather than fetch it. Building nokey stays on
      # the toolchain go.mod names.
      - name: Install GoReleaser
        env:
          GOTOOLCHAIN: auto
        run: |
          for attempt in 1 2 3; do
            go install github.com/goreleaser/goreleaser/v2@v2.18.0 && exit 0
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Confirm the build toolchain
        run: go version

      - name: Run GoReleaser
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Dry run: building every target, publishing nothing."
            goreleaser release --clean --snapshot
          else
            goreleaser release --clean
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
