name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.26"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      # -race matters here: the proxy, the MCP server and the PTY reader all
      # run concurrent goroutines. Tests stub the keyring, so the macOS leg
      # never touches the real keychain and cannot block on a UI prompt.
      - name: Test
        run: go test ./... -race

      - name: Vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26"

      # Installed directly rather than through golangci/golangci-lint-action.
      # This org only permits GitHub-owned and Marketplace-verified actions,
      # and that action is neither, so referencing it failed the entire
      # workflow at startup — taking the build and test jobs down with it.
      # Retried: resolving the linter's own module graph occasionally trips
      # over a transient sum.golang.org error, which has nothing to do with
      # this repository.
      - name: Install golangci-lint
        run: |
          for attempt in 1 2 3; do
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 && exit 0
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      - name: golangci-lint
        run: golangci-lint run --timeout=5m

      # golangci-lint covers formatting too, but this names the files and
      # does not depend on the linter's config staying in step.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # Windows ships but has no CI runner here; vetting for it catches
      # build breaks in the windows-tagged files (redact, audit lock) and
      # type-checks the tests against them. The Windows build is CGO-free,
      # so it cross-compiles cleanly from Linux.
      - name: Vet for Windows
        env:
          GOOS: windows
        run: go vet ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"

      - name: Install govulncheck
        run: |
          for attempt in 1 2 3; do
            go install golang.org/x/vuln/cmd/govulncheck@v1.7.0 && exit 0
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      # Fails only on vulnerabilities this code actually reaches, so an
      # advisory in an unused corner of a dependency will not block a PR.
      - name: govulncheck
        run: govulncheck ./...
