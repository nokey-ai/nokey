name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.26"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      # -race matters here: the proxy, the MCP server and the PTY reader all
      # run concurrent goroutines. Tests stub the keyring, so the macOS leg
      # never touches the real keychain and cannot block on a UI prompt.
      - name: Test
        run: go test ./... -race

      - name: Vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      # Installed directly rather than through golangci/golangci-lint-action.
      # This org only permits GitHub-owned and Marketplace-verified actions,
      # and that action is neither, so referencing it failed the entire
      # workflow at startup — taking the build and test jobs down with it.
      # Retried: resolving the linter's own module graph occasionally trips
      # over a transient sum.golang.org error, which has nothing to do with
      # this repository.
      - name: Install golangci-lint
        run: |
          for attempt in 1 2 3; do
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 && exit 0
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      - name: golangci-lint
        run: golangci-lint run --timeout=5m

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install govulncheck
        run: |
          for attempt in 1 2 3; do
            go install golang.org/x/vuln/cmd/govulncheck@v1.7.0 && exit 0
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          exit 1

      # Fails only on vulnerabilities this code actually reaches, so an
      # advisory in an unused corner of a dependency will not block a PR.
      - name: govulncheck
        run: govulncheck ./...
